<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ülkeler Yarışı</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #070b16; color: #fff; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }

  header { text-align: center; padding: 14px 6px 8px; }
  header h1 { font-size: 17px; font-weight: 800; line-height: 1.25; text-shadow: 0 2px 8px #000; }
  #status { display: inline-block; margin-top: 6px; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #ffffff14; color: #9aa4b8; }
  #status.ok { background: #16a34a33; color: #4ade80; }
  #status.bad { background: #dc262633; color: #f87171; }

  #track { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0;
           background: linear-gradient(180deg, #0d1426, #0a1020); border-radius: 18px; padding: 6px 0; position: relative; overflow: hidden; }
  #track::after { content: ""; position: absolute; right: 10px; top: 0; bottom: 0; width: 6px;
                  background: repeating-linear-gradient(180deg, #fff 0 8px, #111 8px 16px); opacity: .5; }
  .lane { position: relative; flex: 1; max-height: 260px; border-bottom: 2px solid transparent;
          border-image: repeating-linear-gradient(90deg, #4fc3f7 0 26px, transparent 26px 40px) 1; }
  .lane:last-child { border-bottom: none; }
  .badge { position: absolute; left: 8px; top: 8px; z-index: 3; display: flex; align-items: center; gap: 5px;
           background: #000a; border: 1px solid #ffffff2a; border-radius: 9px; padding: 3px 8px; font-size: 14px; font-weight: 800; }
  .mini { display: inline-block; width: 22px; height: 15px; border-radius: 2px; position: relative; }
  .mini.sun::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #febd11; box-shadow: 0 0 0 1px #febd1188; }
  .badge .gift { font-size: 10px; font-weight: 600; color: #9aa4b8; }
  .runner { position: absolute; bottom: 8px; left: 0; height: min(62%, 130px); transition: transform .8s cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .runner img { height: 100%; max-width: 100vw; display: block; animation: run .45s ease-in-out infinite; filter: drop-shadow(0 6px 6px #0009); }
  .runner .name { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; opacity: .85; }
  .lane.lead .runner img { filter: drop-shadow(0 0 14px #ffd54a) drop-shadow(0 6px 6px #0009); }
  .lane.lead .crown { display: block; }
  .crown { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 20px; }
  @keyframes run { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7%) rotate(2deg); } }
  .pop { position: absolute; z-index: 4; font-weight: 900; font-size: 18px; color: #ffd54a; text-shadow: 0 2px 6px #000;
         pointer-events: none; animation: pop 1.1s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translateY(0) scale(1.2); } to { opacity: 0; transform: translateY(-40px) scale(.9); } }

  #banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 20;
            background: linear-gradient(135deg, #ffd54a, #ff8a00); color: #1a1000; font-weight: 900; font-size: 24px;
            padding: 14px 22px; border-radius: 18px; text-align: center; box-shadow: 0 10px 40px #000a; pointer-events: none;
            transition: all .35s cubic-bezier(.2,1.4,.4,1); white-space: nowrap; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #feed { padding-right: 120px !important; height: 86px; overflow: hidden; padding: 8px 4px 4px; font-size: 13px; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; }
  #feed div { opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fin .3s; }
  @keyframes fin { from { opacity: 0; transform: translateY(8px); } }

  #tools { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 15; display: flex; gap: 6px; opacity: .35; }
  #tools button { background: #ffffff22; color: #fff; border: 0; border-radius: 10px; font-size: 15px; width: 34px; height: 34px; }

  #start { position: fixed; inset: 0; z-index: 30; background: #070b16f2; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #start .card { width: 100%; max-width: 360px; background: #111a30; border-radius: 22px; padding: 24px; text-align: center; }
  #start h2 { font-size: 22px; margin-bottom: 6px; }
  #start p { font-size: 13px; color: #9aa4b8; margin-bottom: 18px; line-height: 1.4; }
  #start input { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid #2a3654; background: #0a1020; color: #fff; margin-bottom: 12px; }
  #start button { width: 100%; font-size: 17px; font-weight: 800; padding: 14px; border-radius: 12px; border: 0; margin-bottom: 10px; }
  #go { background: #fe2c55; color: #fff; }
  #demo { background: #ffffff18; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><div id="status">bağlanmadı</div></header>
  <div id="track"></div>
  <div id="feed"></div>
</div>
<div id="banner"></div>
<div id="tools"><button id="mute" title="Ses">🔊</button><button id="reset" title="Sıfırla">⟲</button><button id="back" title="Ayarlar">⚙︎</button></div>

<div id="start"><div class="card">
  <h2>🏁 Ülkeler Yarışı</h2>
  <p>Canlı yayın açacağın TikTok kullanıcı adını yaz. Yayın açıkken oyun hediyeleri otomatik sayar.</p>
  <input id="user" placeholder="@kullaniciadi" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">Başlat</button>
  <button id="demo">Deneme modu (sahte hediyeler)</button>
</div></div>

<script>
const C = window.OYUN;
const $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- Durum ----------
const teams = C.ulkeler.map((u, i) => ({ ...u, i, puan: 0 }));
function flagHTML(t) {
  if (t.bayrak) return t.bayrak;
  const n = t.renkler.length, stops = t.renkler.map((c, k) => `${c} ${k * 100 / n}% ${(k + 1) * 100 / n}%`).join(',');
  return `<span class="mini${t.gunes ? ' sun' : ''}" style="background:linear-gradient(180deg,${stops})"></span>`;
}
const flagText = t => t.bayrak || '☀️';
let leader = -1, muted = false, es = null, demoTimer = null;
try { const saved = JSON.parse(store.get('yaris-puan') || 'null'); if (saved && saved.length === teams.length) saved.forEach((p, i) => teams[i].puan = p); } catch {}

$('#title').textContent = C.baslik;

// ---------- Bayrak renkli hayvan resmi (emoji + bayrak şeritleri) ----------
function makeRunnerImage(t) {
  const S = 160, c = document.createElement('canvas'); c.width = S * 1.3; c.height = S;
  const x = c.getContext('2d');
  x.font = `${S * 0.92}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.translate(c.width / 2, S / 2 + S * 0.05); x.scale(-1, 1); // emojiler sola bakar, sağa çevir
  x.fillText(t.hayvan, 0, 0);
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.globalAlpha = 0.62;
  const n = t.renkler.length, h = S / n;
  t.renkler.forEach((col, k) => { x.fillStyle = col; x.fillRect(0, k * h, c.width, h + 1); });
  return c.toDataURL();
}

// ---------- Pistleri çiz ----------
const track = $('#track');
teams.forEach(t => {
  const lane = document.createElement('div'); lane.className = 'lane';
  lane.innerHTML = `<div class="badge">${flagHTML(t)} <span class="pts">0</span> <span class="gift">${t.hediye}</span></div>
    <div class="runner"><span class="crown">👑</span><img alt=""></div>`;
  lane.querySelector('img').src = makeRunnerImage(t);
  track.appendChild(lane);
  t.lane = lane; t.runner = lane.querySelector('.runner'); t.pts = lane.querySelector('.pts');
});

function render() {
  const max = Math.max(1, ...teams.map(t => t.puan));
  const W = track.clientWidth, rw = teams[0].runner.offsetWidth || 90;
  const room = Math.max(0, W - rw - 22);
  teams.forEach(t => {
    const ratio = t.puan / max;
    t.runner.style.transform = `translateX(${8 + ratio * room * 0.97}px)`;
    t.pts.textContent = t.puan.toLocaleString('tr-TR');
  });
  // lider kontrolü
  let best = -1, bestP = 0;
  teams.forEach(t => { if (t.puan > bestP) { bestP = t.puan; best = t.i; } });
  if (best !== -1 && best !== leader) {
    const first = leader === -1;
    leader = best;
    teams.forEach(t => t.lane.classList.toggle('lead', t.i === leader));
    playMusic(teams[leader]);
    if (!first || bestP > 0) showBanner(`${flagText(teams[leader])} ${teams[leader].ad} öne geçti!`);
  }
  store.set('yaris-puan', JSON.stringify(teams.map(t => t.puan)));
}
window.addEventListener('resize', render);

function addPoints(t, n) {
  if (n <= 0) return;
  t.puan += n;
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = `+${n}`;
  const r = t.runner.getBoundingClientRect(), tr = t.lane.getBoundingClientRect();
  p.style.left = (r.left - tr.left + r.width * 0.4) + 'px'; p.style.top = '4px';
  t.lane.appendChild(p); setTimeout(() => p.remove(), 1200);
  render();
}

let bannerT;
function showBanner(text) {
  const b = $('#banner'); b.textContent = text; b.classList.add('show');
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 2200);
}

function feed(html) {
  const f = $('#feed'), d = document.createElement('div'); d.textContent = html; f.appendChild(d);
  while (f.children.length > 4) f.firstChild.remove();
}

// ---------- Müzik ----------
let audioEl = null, ctx = null, synth = null;
function stopMusic() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if (synth) { clearInterval(synth.timer); synth.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); synth = null; }
}
function playMusic(t) {
  stopMusic();
  if (muted || !t) return;
  if (t.muzik) {
    audioEl = new Audio(t.muzik); audioEl.loop = true; audioEl.volume = 0.9;
    audioEl.play().catch(() => {});
    return;
  }
  // Müzik dosyası yoksa: her ülkeye özel kısa bir melodi üret
  if (!ctx) return;
  const scales = [[0,3,5,7,10,12], [0,2,4,7,9,12], [0,1,4,5,7,8], [0,2,3,7,8,12], [0,4,7,9,11,12]];
  const sc = scales[t.i % scales.length], root = 196 * Math.pow(2, (t.i * 2) / 12);
  const gain = ctx.createGain(); gain.gain.value = 0.18; gain.connect(ctx.destination);
  let step = 0, seed = t.i * 7 + 3;
  const pattern = Array.from({ length: 16 }, () => { seed = (seed * 37 + 11) % 101; return seed % 9 < 7 ? sc[seed % sc.length] : null; });
  synth = { gain, timer: setInterval(() => {
    const note = pattern[step % 16], now = ctx.currentTime;
    if (step % 4 === 0) beep(root / 2, now, 0.22, 'triangle', gain, 0.9);           // bas
    if (note !== null) beep(root * Math.pow(2, note / 12), now, 0.16, 'square', gain, 0.35); // melodi
    step++;
  }, 170) };
}
function beep(freq, at, dur, type, out, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(out); o.start(at); o.stop(at + dur + 0.02);
}

// ---------- Olayları işle ----------
const norm = s => String(s || '').toLocaleLowerCase('tr-TR').trim();
function onGift(e) {
  const t = teams.find(t => norm(t.hediye) === norm(e.hediye) || String(t.hediye) === String(e.giftId));
  if (!t) { feed(`🎁 ${e.kullanici}: ${e.hediye} x${e.adet}`); return; }
  const pts = C.hediyeCoinIleCarp ? (e.coin || 1) * e.adet : e.adet;
  feed(`🎁 ${e.kullanici} → ${flagText(t)} ${t.ad} (${e.hediye} x${e.adet})`);
  addPoints(t, pts);
}
function onComment(e) {
  if (!C.yorumPuani) return;
  const text = norm(e.yorum), words = text.split(/[^\p{L}\p{N}]+/u);
  for (const t of teams) {
    const hit = t.kelimeler.some(k => { k = norm(k); return /[\p{L}\p{N}]/u.test(k) ? words.includes(k) : text.includes(k); });
    if (hit) { feed(`💬 ${e.kullanici}: ${flagText(t)} ${t.ad}`); addPoints(t, C.yorumPuani); return; }
  }
}

function setStatus(text, cls) { const s = $('#status'); s.textContent = text; s.className = cls || ''; }
const statusText = { baglaniyor: ['bağlanıyor…'], bagli: ['● canlı yayına bağlı', 'ok'], hata: ['yayın bulunamadı, tekrar deneniyor…', 'bad'],
                     bitti: ['yayın bitti', 'bad'], koptu: ['bağlantı koptu, tekrar deneniyor…', 'bad'] };

function connect(user) {
  if (es) es.close();
  setStatus('bağlanıyor…');
  es = new EventSource('events?user=' + encodeURIComponent(user));
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.type === 'hediye') onGift(e);
    else if (e.type === 'yorum') onComment(e);
    else if (e.type === 'durum') { const s = statusText[e.durum] || [e.durum]; setStatus(s[0], s[1]); }
  };
  es.onerror = () => setStatus('sunucuya bağlanılıyor…', 'bad');
}

function startDemo() {
  setStatus('deneme modu');
  const names = ['Ali', 'Ayşe', 'Mehmet', 'Zeynep', 'Ahmad', 'Leyla', 'Omar'];
  demoTimer = setInterval(() => {
    const t = teams[Math.floor(Math.random() * teams.length)], who = names[Math.floor(Math.random() * names.length)];
    if (Math.random() < 0.3) onComment({ kullanici: who, yorum: t.kelimeler[0] });
    else onGift({ kullanici: who, hediye: t.hediye, adet: 1 + Math.floor(Math.random() * 5), coin: 1 });
  }, 700);
}

// ---------- Başlangıç ekranı ----------
$('#user').value = store.get('yaris-user') || '';
function begin(demo) {
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
  // iOS sesin açılması için dokunma anında boş bir ses çal
  try { const a = new Audio(); a.play().catch(() => {}); } catch {}
  $('#start').style.display = 'none';
  leader = -1; render();
  if (demo) startDemo();
  else { const u = $('#user').value.replace(/^@/, '').trim(); store.set('yaris-user', u); connect(u); }
}
$('#go').onclick = () => { if (!$('#user').value.trim()) { $('#user').focus(); return; } begin(false); };
$('#demo').onclick = () => begin(true);
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; muted ? stopMusic() : playMusic(teams[leader]); };
$('#reset').onclick = () => { if (!confirmReset()) return; teams.forEach(t => t.puan = 0); leader = -1; stopMusic(); teams.forEach(t => t.lane.classList.remove('lead')); render(); };
$('#back').onclick = () => { clearInterval(demoTimer); if (es) es.close(); stopMusic(); $('#start').style.display = 'flex'; };
let resetArm = 0;
function confirmReset() { // iki kere dokununca sıfırlar (yanlışlıkla silinmesin)
  const now = Date.now(); if (now - resetArm < 1500) { resetArm = 0; return true; }
  resetArm = now; showBanner('Sıfırlamak için tekrar dokun'); return false;
}
render();
</script>
</body>
</html>
