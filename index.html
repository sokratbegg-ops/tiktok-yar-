<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yarış</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #070b16; color: #fff; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }

  header { text-align: center; padding: 14px 6px 8px; }
  header h1 { font-size: 17px; font-weight: 800; line-height: 1.25; text-shadow: 0 2px 8px #000; }
  #status { display: inline-block; margin-top: 6px; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #ffffff14; color: #9aa4b8; }
  #status.ok { background: #16a34a33; color: #4ade80; }
  #status.bad { background: #dc262633; color: #f87171; }

  #track { flex: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, #0e1730, #0a1020);
           border-radius: 18px; position: relative; overflow: hidden; }
  .lane { position: relative; flex: 1; border-bottom: 2px solid #4fc3f733; }
  .lane:last-child { border-bottom: none; }
  .lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge { position: absolute; left: 10px; top: 10px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
  .score { display: inline-flex; align-items: center; gap: 7px; background: #000b; border: 1px solid #ffffff2a; border-radius: 11px;
           padding: 4px 10px; font-size: 20px; font-weight: 900; width: max-content; }
  .giftchip { display: inline-flex; align-items: center; gap: 6px; background: #fe2c55; border-radius: 20px; padding: 4px 11px 4px 5px;
              font-size: 14px; font-weight: 800; width: max-content; box-shadow: 0 4px 14px #fe2c5555; }
  .giftchip .gi { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; overflow: hidden; }
  .giftchip .gi img { width: 100%; height: 100%; object-fit: contain; }
  .hint b.lk { color: #ff6b8a; }
  .hint { line-height: 1.5; font-size: 11px; color: #c9d1e0; opacity: .85; padding-left: 4px; }
  .mini { display: inline-block; width: 26px; height: 18px; border-radius: 3px; position: relative; }
  .mini.sun::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #febd11; }
  .pop { position: absolute; z-index: 4; font-weight: 900; font-size: 22px; color: #ffd54a; text-shadow: 0 2px 6px #000;
         pointer-events: none; animation: pop 1.1s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translateY(0) scale(1.3); } to { opacity: 0; transform: translateY(-50px) scale(.9); } }

  #banner { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 20;
            background: linear-gradient(135deg, #ffd54a, #ff8a00); color: #1a1000; font-weight: 900; font-size: 24px;
            padding: 14px 22px; border-radius: 18px; text-align: center; box-shadow: 0 10px 40px #000a; pointer-events: none;
            transition: all .35s cubic-bezier(.2,1.4,.4,1); white-space: nowrap; }
  #unmute { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 110px); transform: translateX(-50%); z-index: 25;
            background: #fe2c55; color: #fff; border: 0; border-radius: 30px; padding: 14px 22px; font-size: 16px; font-weight: 800;
            box-shadow: 0 8px 30px #000a; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #feed { height: 86px; overflow: hidden; padding: 8px 120px 4px 4px; font-size: 13px; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; }
  #feed div { opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fin .3s; }
  @keyframes fin { from { opacity: 0; transform: translateY(8px); } }

  #tools { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 15; display: flex; gap: 6px; opacity: .35; }
  #tools button { background: #ffffff22; color: #fff; border: 0; border-radius: 10px; font-size: 15px; width: 34px; height: 34px; }

  #start { position: fixed; inset: 0; z-index: 30; background: #070b16f5; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  #start .card { width: 100%; max-width: 380px; background: #111a30; border-radius: 22px; padding: 22px; text-align: center; }
  #start h2 { font-size: 22px; margin-bottom: 6px; }
  #start p { font-size: 13px; color: #9aa4b8; margin-bottom: 14px; line-height: 1.4; }
  #start input[type=text] { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid #2a3654; background: #0a1020; color: #fff; margin-bottom: 12px; }
  .bigbtn { width: 100%; font-size: 17px; font-weight: 800; padding: 14px; border-radius: 12px; border: 0; margin-bottom: 10px; color: #fff; }
  #go { background: #fe2c55; }
  #demo { background: #ffffff18; }
  .sec { text-align: left; font-size: 13px; font-weight: 800; color: #c9d1e0; margin: 8px 0 8px; }
  .mrow { display: flex; align-items: center; gap: 8px; background: #0a1020; border-radius: 12px; padding: 10px; margin-bottom: 8px; text-align: left; }
  .mrow .nm { font-weight: 800; font-size: 14px; }
  .mrow .fn { font-size: 11px; color: #9aa4b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .info { flex: 1; min-width: 0; }
  .mrow label, .mrow button { flex: none; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 9px; background: #2a3654; color: #fff; border: 0; }
  .mrow input { display: none; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><div id="status">bağlanmadı</div></header>
  <div id="track"></div>
  <div id="feed"></div>
</div>
<div id="banner"></div>
<button id="unmute">🔊 Ses kapandı — açmak için dokun</button>
<div id="tools"><button id="mute">🔊</button><button id="reset">⟲</button><button id="back">⚙︎</button></div>

<div id="start"><div class="card">
  <h2>🏁 Yarış</h2>
  <p>Canlı yayın açacağın TikTok kullanıcı adını yaz. Yayın açıkken oyun hediyeleri otomatik sayar.</p>
  <input type="text" id="user" placeholder="@kullaniciadi" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="sec">🎵 Öne geçince çalacak müzikler</div>
  <div id="musicRows"></div>
  <button class="bigbtn" id="go">Başlat</button>
  <button class="bigbtn" id="demo">Deneme modu (sahte hediyeler)</button>
</div></div>

<script>
const C = window.OYUN;
const $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const DPR = Math.min(window.devicePixelRatio || 1, 1.5); // pil/ısınma için çözünürlük sınırı

// ================= Takımlar =================
const teams = C.ulkeler.map((u, i) => ({ ...u, i, puan: 0, x: 0, phase: Math.random() * 6, boost: 0, dust: [] }));
let leader = -1, muted = false, es = null, demoTimer = null, giftImages = {};
try { const sv = JSON.parse(store.get('yaris-puan') || 'null'); if (sv && sv.length === teams.length) sv.forEach((p, i) => teams[i].puan = p); } catch {}
$('#title').textContent = C.baslik;

function flagHTML(t) {
  if (t.bayrak) return t.bayrak;
  const n = t.renkler.length, stops = t.renkler.map((c, k) => `${c} ${k * 100 / n}% ${(k + 1) * 100 / n}%`).join(',');
  return `<span class="mini${t.amblem === 'gunes' ? ' sun' : ''}" style="background:linear-gradient(180deg,${stops})"></span>`;
}
const flagText = t => t.bayrak || '☀️';

// ================= Beğeniler =================
const likeTeam = teams.find(t => C.begeniTakimi && norm0(t.ad) === norm0(C.begeniTakimi));
const likePer = Math.max(1, C.begeniBasinaPuan || 50);
let likeBank = 0;
function norm0(x) { return String(x || '').toLocaleLowerCase('tr-TR').trim(); }
function hintFor(t) {
  const words = t.kelimeler.filter(k => !/[\u{1F1E6}-\u{1F1FF}]/u.test(k)).slice(0, 1).map(k => `"${k}"`);
  const marks = t.kelimeler.filter(k => /^[\p{P}]+$/u.test(k)).map(k => `"${k}"`);
  let h = `veya yoruma ${[...new Set([...words, ...marks])].join(' ya da ')} yaz`;
  if (t === likeTeam) h += `<br>❤️ ekrana bas: ${likePer} beğeni = 1 puan <b class="lk">0/${likePer}</b>`;
  return h;
}

// ================= Pistler =================
const track = $('#track');
teams.forEach(t => {
  const lane = document.createElement('div'); lane.className = 'lane';
  lane.innerHTML = `<canvas></canvas><div class="badge">
      <div class="score">${flagHTML(t)} <span class="pts">0</span></div>
      <div class="giftchip"><span class="gi">${/\.(png|jpe?g|webp)$/i.test(t.hediyeIkon || '') ? `<img src="${t.hediyeIkon}" alt="">` : (t.hediyeIkon || '🎁')}</span><span>${t.hediyeAdi || t.hediye} at</span></div>
      <div class="hint">${hintFor(t)}</div></div>`;
  track.appendChild(lane);
  t.lane = lane; t.cv = lane.querySelector('canvas'); t.cx = t.cv.getContext('2d');
  t.pts = lane.querySelector('.pts'); t.gi = lane.querySelector('.gi');
});
function updateGiftIcons() {
  teams.forEach(t => {
    const img = giftImages[String(t.hediye).toLowerCase()];
    if (img && !t.gi.querySelector('img')) t.gi.innerHTML = `<img src="${img}" alt="">`;
  });
}

function sizeCanvases() {
  teams.forEach(t => {
    const r = t.lane.getBoundingClientRect();
    t.W = r.width; t.H = r.height;
    t.cv.width = Math.round(r.width * DPR); t.cv.height = Math.round(r.height * DPR);
  });
}
window.addEventListener('resize', () => { sizeCanvases(); });

// ================= Hayvan çizimi =================
// Bacak: kalça/omuz noktasından iki parçalı, dörtnala döngüsüyle hareket eder
function legPts(hx, hy, s, p, front) {
  const L1 = 0.25 * s, L2 = 0.25 * s;
  const th = 0.62 * Math.sin(p);                           // üst bacak açısı
  const fold = front ? -1.25 * Math.max(0, -Math.cos(p))   // ön bacak geri katlanır
                     : 1.05 * Math.max(0, Math.cos(p));    // arka bacak öne katlanır
  const kx = hx + L1 * Math.sin(th), ky = hy + L1 * Math.cos(th);
  const fx = kx + L2 * Math.sin(th + fold), fy = ky + L2 * Math.cos(th + fold);
  return [hx, hy, kx, ky, fx, fy];
}
function strokeLeg(c, pts, s) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.lineWidth = 0.11 * s; c.beginPath(); c.moveTo(pts[0], pts[1]); c.lineTo(pts[2], pts[3]); c.stroke();
  c.lineWidth = 0.075 * s; c.beginPath(); c.moveTo(pts[2], pts[3]); c.lineTo(pts[4], pts[5]); c.stroke();
  c.beginPath(); c.ellipse(pts[4] + 0.03 * s, pts[5], 0.055 * s, 0.035 * s, 0, 0, 7); c.fill();
}
function bodyShapes(c, kind, s, p) {
  const sway = Math.sin(p * 1.0) * 0.06 * s;
  c.beginPath();
  c.ellipse(0, 0, 0.42 * s, 0.17 * s, 0, 0, 7);                    // gövde
  c.ellipse(0.24 * s, -0.02 * s, 0.2 * s, 0.2 * s, 0, 0, 7);        // göğüs
  c.ellipse(-0.27 * s, 0.0, 0.18 * s, 0.18 * s, 0, 0, 7);           // kalça
  c.fill();
  if (kind === 'aslan') {
    // yele
    c.beginPath();
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * Math.PI * 2, r = (k % 2 ? 0.24 : 0.3) * s;
      const x = 0.52 * s + Math.cos(a) * r, y = -0.2 * s + Math.sin(a) * r;
      k ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.fill();
    c.beginPath(); c.ellipse(0.62 * s, -0.2 * s, 0.13 * s, 0.14 * s, 0, 0, 7); c.fill();      // yüz
    c.beginPath(); c.ellipse(0.74 * s, -0.14 * s, 0.08 * s, 0.07 * s, 0, 0, 7); c.fill();     // burun
    // kuyruk + püskül
    c.lineCap = 'round'; c.lineWidth = 0.05 * s;
    c.beginPath(); c.moveTo(-0.42 * s, -0.06 * s);
    c.quadraticCurveTo(-0.65 * s, -0.05 * s + sway, -0.78 * s, -0.22 * s + sway); c.stroke();
    c.beginPath(); c.ellipse(-0.8 * s, -0.25 * s + sway, 0.07 * s, 0.06 * s, 0, 0, 7); c.fill();
  } else {
    // kurt: boyun, kafa, uzun burun, sivri kulaklar
    c.beginPath(); c.moveTo(0.22 * s, -0.16 * s); c.lineTo(0.5 * s, -0.3 * s); c.lineTo(0.6 * s, -0.12 * s); c.lineTo(0.36 * s, 0.08 * s); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(0.56 * s, -0.24 * s, 0.13 * s, 0.11 * s, -0.2, 0, 7); c.fill();
    c.beginPath(); c.moveTo(0.6 * s, -0.31 * s); c.lineTo(0.86 * s, -0.2 * s); c.lineTo(0.84 * s, -0.15 * s); c.lineTo(0.6 * s, -0.14 * s); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(0.48 * s, -0.31 * s); c.lineTo(0.47 * s, -0.5 * s); c.lineTo(0.58 * s, -0.33 * s); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(0.54 * s, -0.32 * s); c.lineTo(0.56 * s, -0.49 * s); c.lineTo(0.63 * s, -0.31 * s); c.closePath(); c.fill();
    // gür kuyruk
    c.beginPath(); c.moveTo(-0.4 * s, -0.1 * s);
    c.quadraticCurveTo(-0.62 * s, -0.16 * s + sway, -0.86 * s, -0.04 * s + sway);
    c.quadraticCurveTo(-0.66 * s, 0.06 * s + sway, -0.4 * s, 0.04 * s); c.closePath(); c.fill();
  }
}
const off = document.createElement('canvas'), oc = off.getContext('2d');
const off2 = document.createElement('canvas'), oc2 = off2.getContext('2d');
const off3 = document.createElement('canvas'), oc3 = off3.getContext('2d');

function paintFlag(c, t, s, w, h, ox, oy) {
  // Bayrak desenini sadece hayvanın üstüne boya
  if (off3.width !== w || off3.height !== h) { off3.width = w; off3.height = h; }
  const top = oy - 0.5 * s, bot = oy + 0.62 * s, n = t.renkler.length;
  oc3.clearRect(0, 0, w, h);
  t.renkler.forEach((col, k) => {
    oc3.fillStyle = col;
    const y0 = k === 0 ? 0 : top + (bot - top) * k / n, y1 = k === n - 1 ? h : top + (bot - top) * (k + 1) / n;
    oc3.fillRect(0, y0, w, y1 - y0 + 1);
  });
  c.globalCompositeOperation = 'source-in';
  c.drawImage(off3, 0, 0);
  c.globalCompositeOperation = 'source-atop';
  if (t.amblem === 'ay') {           // ay yıldız
    const cx = ox - 0.04 * s, cy = oy - 0.01 * s, r = 0.1 * s;
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
    c.fillStyle = t.renkler[0]; c.beginPath(); c.arc(cx + 0.025 * s, cy, r * 0.8, 0, 7); c.fill();
    c.fillStyle = '#fff'; star(c, cx + 0.13 * s, cy, 0.045 * s);
  } else if (t.amblem === 'gunes') { // sarı güneş
    const cx = ox - 0.02 * s, cy = oy - 0.0 * s;
    c.fillStyle = '#febd11'; c.beginPath();
    for (let k = 0; k < 42; k++) { const a = k / 42 * Math.PI * 2, r = (k % 2 ? 0.05 : 0.085) * s; c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    c.closePath(); c.fill();
  }
  // gölgelendirme: üst açık, alt koyu
  const g = c.createLinearGradient(0, oy - 0.5 * s, 0, oy + 0.62 * s);
  g.addColorStop(0, 'rgba(255,255,255,0.18)'); g.addColorStop(0.45, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'source-over';
}
function star(c, x, y, r) {
  c.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.42 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fill();
}

function drawAnimal(ctx, t, x, groundY, s, glow) {
  const p = t.phase;
  const bounce = Math.abs(Math.cos(p)) * 0.07 * s;
  const tilt = Math.sin(p) * 0.07;
  const w = Math.ceil(2.0 * s), h = Math.ceil(1.45 * s);
  if (off.width !== w || off.height !== h) { off.width = off2.width = w; off.height = off2.height = h; }
  const ox = w * 0.47, oy = h * 0.42;

  // uzak bacaklar (koyu)
  oc2.setTransform(1, 0, 0, 1, 0, 0); oc2.clearRect(0, 0, w, h);
  oc2.translate(ox, oy); oc2.rotate(tilt); oc2.fillStyle = oc2.strokeStyle = '#000';
  strokeLeg(oc2, legPts(0.3 * s, 0.04 * s, s, p + 0.55, true), s);
  strokeLeg(oc2, legPts(-0.3 * s, 0.04 * s, s, p + Math.PI + 0.55, false), s);
  oc2.setTransform(1, 0, 0, 1, 0, 0);
  paintFlag(oc2, t, s, w, h, ox, oy);
  oc2.globalCompositeOperation = 'source-atop'; oc2.fillStyle = 'rgba(0,0,0,0.38)'; oc2.fillRect(0, 0, w, h); oc2.globalCompositeOperation = 'source-over';

  // gövde + yakın bacaklar
  oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, w, h);
  oc.translate(ox, oy); oc.rotate(tilt); oc.fillStyle = oc.strokeStyle = '#000';
  bodyShapes(oc, t.hayvan, s, p);
  strokeLeg(oc, legPts(0.3 * s, 0.04 * s, s, p, true), s);
  strokeLeg(oc, legPts(-0.3 * s, 0.04 * s, s, p + Math.PI, false), s);
  oc.setTransform(1, 0, 0, 1, 0, 0);
  paintFlag(oc, t, s, w, h, ox, oy);
  // göz
  oc.save(); oc.translate(ox, oy); oc.rotate(tilt); oc.fillStyle = '#111';
  oc.beginPath(); oc.arc((t.hayvan === 'aslan' ? 0.66 : 0.6) * s, -0.26 * s, 0.022 * s, 0, 7); oc.fill(); oc.restore();

  // yer gölgesi
  const footY = groundY;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, footY, 0.55 * s, 0.06 * s, 0, 0, 7); ctx.fill();

  const dx = x - ox, dy = footY - 0.62 * s - bounce - oy;
  ctx.save();
  if (glow) { // ucuz parlama (shadowBlur telefonu çok yoruyor)
    const gx = x, gy = footY - 0.55 * s, gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, 0.9 * s);
    gr.addColorStop(0, 'rgba(255,213,74,0.35)'); gr.addColorStop(1, 'rgba(255,213,74,0)');
    ctx.fillStyle = gr; ctx.fillRect(gx - s, gy - s, 2 * s, 2 * s);
  }
  ctx.drawImage(off2, dx, dy);
  ctx.drawImage(off, dx, dy);
  ctx.restore();
}

// ================= Animasyon döngüsü =================
let groundOff = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 31) return;            // saniyede ~30 kare: daha az ısınma
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.08, (now - last) / 1000); last = now;
  const max = Math.max(1, ...teams.map(t => t.puan));
  groundOff += dt * 260;
  teams.forEach(t => {
    const c = t.cx, W = t.W, H = t.H;
    if (!W) return;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    const s = Math.min(H * 0.5, W * 0.25);
    const groundY = H - Math.max(10, H * 0.08);

    // akan zemin (koşuyormuş hissi)
    c.strokeStyle = 'rgba(79,195,247,0.55)'; c.lineWidth = 3; c.setLineDash([26, 16]); c.lineDashOffset = groundOff;
    c.beginPath(); c.moveTo(0, groundY + 6); c.lineTo(W, groundY + 6); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 2; c.setLineDash([4, 40]); c.lineDashOffset = groundOff * 0.5;
    for (let k = 1; k <= 3; k++) { const y = groundY - k * H * 0.14; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.setLineDash([]);
    // bitiş çizgisi
    c.fillStyle = 'rgba(255,255,255,0.5)';
    for (let y = 0; y < H; y += 12) c.fillRect(W - 14 + ((y / 12) % 2) * 4, y, 4, 6);

    // konum
    const minX = 0.9 * s + 6, maxX = W - 0.9 * s - 18;
    const target = minX + (t.puan / max) * (maxX - minX);
    if (!t.x) t.x = minX;
    t.x += (target - t.x) * Math.min(1, dt * 3);

    // dörtnala hızı (puan gelince hızlanır)
    t.boost = Math.max(0, t.boost - dt * 1.2);
    t.phase += dt * (11 + t.boost * 9);

    // toz
    if (Math.cos(t.phase) > 0.92 && Math.random() < 0.6) t.dust.push({ x: t.x - 0.35 * s, y: groundY, r: 0.04 * s, a: 0.5 });
    t.dust.forEach(d => { d.x -= dt * 160; d.y -= dt * 18; d.r += dt * 0.25 * s; d.a -= dt * 0.9; });
    t.dust = t.dust.filter(d => d.a > 0);
    t.dust.forEach(d => { c.fillStyle = `rgba(200,190,170,${d.a})`; c.beginPath(); c.arc(d.x, d.y, d.r, 0, 7); c.fill(); });

    // hız çizgileri
    if (t.boost > 0.15) {
      c.strokeStyle = `rgba(255,255,255,${Math.min(0.5, t.boost * 0.4)})`; c.lineWidth = 2;
      for (let k = 0; k < 4; k++) {
        const y = groundY - 0.3 * s - k * 0.17 * s, x0 = t.x - 0.95 * s - ((groundOff * 1.5 + k * 37) % 50);
        c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 - 0.35 * s, y); c.stroke();
      }
    }

    drawAnimal(c, t, t.x, groundY, s, t.i === leader && t.puan > 0);
    if (t.i === leader && t.puan > 0) { c.font = `${0.32 * s}px sans-serif`; c.textAlign = 'center'; c.fillText('👑', t.x + 0.45 * s, groundY - 1.25 * s); }
  });
}

// ================= Puan ve lider =================
function render() {
  teams.forEach(t => t.pts.textContent = t.puan.toLocaleString('tr-TR'));
  let best = -1, bestP = 0;
  teams.forEach(t => { if (t.puan > bestP) { bestP = t.puan; best = t.i; } });
  if (best !== -1 && best !== leader) {
    leader = best;
    playMusic(teams[leader]);
    showBanner(`${flagText(teams[leader])} ${teams[leader].ad} öne geçti!`);
  }
  store.set('yaris-puan', JSON.stringify(teams.map(t => t.puan)));
}
function addPoints(t, n) {
  if (n <= 0) return;
  t.puan += n; t.boost = Math.min(2, t.boost + 0.6 + n * 0.05);
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = `+${n}`;
  p.style.left = Math.max(10, t.x - 20) + 'px'; p.style.top = (t.H * 0.25) + 'px';
  t.lane.appendChild(p); setTimeout(() => p.remove(), 1200);
  render();
}
let bannerT;
function showBanner(text) {
  const b = $('#banner'); b.textContent = text; b.classList.add('show');
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 2200);
}
function feed(text) {
  const f = $('#feed'), d = document.createElement('div'); d.textContent = text; f.appendChild(d);
  while (f.children.length > 4) f.firstChild.remove();
}

// ================= Müzik =================
// Şarkılar telefonda saklanır (IndexedDB), Web Audio ile çalınır: iPhone'da otomatik geçiş için en güvenilir yol
const DB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('yaris', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('m').objectStore('m').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch {} },
  async del(k) { try { const db = await this.open(); await new Promise(res => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch {} },
};
let ctx = null, master = null, current = null, synth = null;

async function loadSongs() {
  for (const t of teams) {
    t.buf = null;
    let data = null;
    const saved = await DB.get('muzik-' + t.i);
    if (saved && saved.data) data = saved.data.slice(0);
    else if (t.muzik) { try { data = await (await fetch(t.muzik)).arrayBuffer(); } catch {} }
    if (data) { try { t.buf = await ctx.decodeAudioData(data); } catch { feed(`⚠️ ${t.ad} müziği açılamadı`); } }
    t.offset = 0;
  }
}
function stopMusic() {
  if (current) {
    const { src, t, startedAt } = current;
    t.offset = (t.offset + ctx.currentTime - startedAt) % t.buf.duration;
    try { src.stop(); } catch {}
    current = null;
  }
  if (synth) { clearInterval(synth.timer); synth.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); synth = null; }
}
function playMusic(t) {
  if (!ctx) return;
  stopMusic();
  if (muted || !t) return;
  if (t.buf) {
    const src = ctx.createBufferSource(); src.buffer = t.buf; src.loop = true; src.connect(master);
    src.start(0, t.offset || 0);
    current = { src, t, startedAt: ctx.currentTime };
    return;
  }
  // müzik seçilmediyse küçük bir melodi
  const scales = [[0,3,5,7,10,12], [0,2,4,7,9,12]], sc = scales[t.i % 2], root = 196 * Math.pow(2, (t.i * 3) / 12);
  const gain = ctx.createGain(); gain.gain.value = 0.18; gain.connect(master);
  let step = 0, seed = t.i * 7 + 3;
  const pattern = Array.from({ length: 16 }, () => { seed = (seed * 37 + 11) % 101; return seed % 9 < 7 ? sc[seed % sc.length] : null; });
  synth = { gain, timer: setInterval(() => {
    const note = pattern[step % 16], now = ctx.currentTime;
    if (step % 4 === 0) beep(root / 2, now, 0.22, 'triangle', gain, 0.9);
    if (note !== null) beep(root * Math.pow(2, note / 12), now, 0.16, 'square', gain, 0.35);
    step++;
  }, 170) };
}
function beep(freq, at, dur, type, out, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(out); o.start(at); o.stop(at + dur + 0.02);
}

// Başlangıç ekranındaki müzik seçme satırları
const rows = $('#musicRows');
teams.forEach(t => {
  const row = document.createElement('div'); row.className = 'mrow';
  row.innerHTML = `<div style="font-size:20px">${flagHTML(t)}</div>
    <div class="info"><div class="nm">${t.ad}</div><div class="fn">yükleniyor…</div></div>
    <label>🎵 Müzik seç<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac"></label>
    <button style="display:none">✕</button>`;
  rows.appendChild(row);
  const fn = row.querySelector('.fn'), inp = row.querySelector('input'), del = row.querySelector('button');
  const show = s => { fn.textContent = s ? s : (t.muzik ? t.muzik : 'seçilmedi (melodi çalar)'); del.style.display = s ? '' : 'none'; };
  DB.get('muzik-' + t.i).then(v => show(v && v.name));
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    fn.textContent = 'kaydediliyor…';
    const data = await f.arrayBuffer();
    await DB.set('muzik-' + t.i, { name: f.name, data });
    show(f.name);
  };
  del.onclick = async () => { await DB.del('muzik-' + t.i); show(null); };
});

// ================= Olaylar =================
const norm = s => String(s || '').toLocaleLowerCase('tr-TR').trim();
function onGift(e) {
  if (e.resim) { giftImages[norm(e.hediye)] = giftImages[norm(e.hediye)] || e.resim; updateGiftIcons(); }
  const t = teams.find(t => norm(t.hediye) === norm(e.hediye) || String(t.hediye) === String(e.giftId));
  if (!t) { feed(`🎁 ${e.kullanici}: ${e.hediye} x${e.adet}`); return; }
  const pts = C.hediyeCoinIleCarp ? (e.coin || 1) * e.adet : e.adet;
  feed(`🎁 ${e.kullanici} → ${flagText(t)} ${t.ad} (${t.hediyeAdi || e.hediye} x${e.adet})`);
  addPoints(t, pts);
}
function onLike(e) {
  if (!likeTeam) return;
  likeBank += e.adet;
  const pts = Math.floor(likeBank / likePer);
  if (pts > 0) { likeBank -= pts * likePer; feed(`❤️ beğeniler → ${flagText(likeTeam)} ${likeTeam.ad} +${pts}`); addPoints(likeTeam, pts); }
  const lk = likeTeam.lane.querySelector('.lk'); if (lk) lk.textContent = `${likeBank}/${likePer}`;
}
function onComment(e) {
  if (!C.yorumPuani) return;
  const text = norm(e.yorum), words = text.split(/[^\p{L}\p{N}]+/u);
  for (const t of teams) {
    const hit = t.kelimeler.some(k => {
      k = norm(k);
      if (/[\p{L}\p{N}]/u.test(k)) return words.includes(k);
      if (/^[\p{P}]+$/u.test(k)) { const only = text.replace(/\s+/g, ''); return only.length > 0 && [...only].every(ch => k.includes(ch)); }
      return text.includes(k);
    });
    if (hit) { feed(`💬 ${e.kullanici}: ${flagText(t)} ${t.ad}`); addPoints(t, C.yorumPuani); return; }
  }
}
function setStatus(text, cls) { const s = $('#status'); s.textContent = text; s.className = cls || ''; }
const statusText = { baglaniyor: ['bağlanıyor…'], bagli: ['● canlı yayına bağlı', 'ok'], hata: ['yayın bulunamadı, tekrar deneniyor…', 'bad'],
                     bitti: ['yayın bitti', 'bad'], koptu: ['bağlantı koptu, tekrar deneniyor…', 'bad'],
                     limit: ['bağlantı limiti doldu, 10 dk sonra tekrar denenecek', 'bad'] };
function connect(user) {
  if (es) es.close();
  setStatus('bağlanıyor…');
  es = new EventSource('events?user=' + encodeURIComponent(user));
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.type === 'hediye') onGift(e);
    else if (e.type === 'yorum') onComment(e);
    else if (e.type === 'begeni') onLike(e);
    else if (e.type === 'hediyeler') { Object.assign(giftImages, e.liste || {}); updateGiftIcons(); }
    else if (e.type === 'durum') {
      let s = statusText[e.durum] || [e.durum];
      if (e.durum === 'hata' && /online/i.test(e.mesaj || '')) s = [`yayın açık değil, ${e.bekle || 30} sn sonra tekrar denenecek`, 'bad'];
      else if (e.durum === 'hata' && e.bekle) s = [`bağlanamadı, ${e.bekle} sn sonra tekrar denenecek`, 'bad'];
      setStatus(s[0], s[1]);
    }
  };
  es.onerror = () => setStatus('sunucuya bağlanılıyor…', 'bad');
}
function startDemo() {
  setStatus('deneme modu');
  const names = ['Ali', 'Ayşe', 'Mehmet', 'Zeynep', 'Rojda', 'Baran', 'Serhat'];
  demoTimer = setInterval(() => {
    const t = teams[Math.floor(Math.random() * teams.length)], who = names[Math.floor(Math.random() * names.length)];
    if (Math.random() < 0.25) onLike({ kullanici: who, adet: 5 + Math.floor(Math.random() * 15) });
    if (Math.random() < 0.3) onComment({ kullanici: who, yorum: Math.random() < 0.5 && t.kelimeler.includes('.') ? '.' : t.kelimeler[0] });
    else onGift({ kullanici: who, hediye: t.hediye, adet: 1 + Math.floor(Math.random() * 5), coin: 1 });
  }, 800);
}

// ================= Başlat =================
$('#user').value = store.get('yaris-user') || '';
async function begin(demo) {
  // ses kilidini dokunma anında aç (iPhone şartı)
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'ambient'; // TikTok yayınıyla birlikte çalabilsin (karışabilir ses)
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination); }
    const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    ctx.resume();
  } catch {}
  started = true;
  try { ctx.onstatechange = () => setTimeout(checkAudio, 200); } catch {}
  $('#start').style.display = 'none';
  sizeCanvases();
  setStatus('müzikler yükleniyor…');
  await loadSongs();
  leader = -1; render();
  if (leader < 0) showBanner('İlk hediyeyi bekliyor… 🎁');
  if (demo) startDemo();
  else { const u = $('#user').value.replace(/^@/, '').trim(); store.set('yaris-user', u); connect(u); }
}
// iPhone başka bir uygulama (TikTok yayını) sesi alınca oyunun sesini durdurur: geri açmayı dene, olmazsa buton göster
let started = false;
function checkAudio() {
  if (!ctx || !started) return;
  if (ctx.state === 'running') { $('#unmute').style.display = 'none'; return; }
  ctx.resume().then(() => {
    if (ctx.state === 'running') { $('#unmute').style.display = 'none'; if (leader >= 0) playMusic(teams[leader]); }
    else $('#unmute').style.display = 'block';
  }).catch(() => { $('#unmute').style.display = 'block'; });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(checkAudio, 300); });
window.addEventListener('pageshow', () => setTimeout(checkAudio, 300));
window.addEventListener('focus', () => setTimeout(checkAudio, 300));
setInterval(checkAudio, 3000);
$('#unmute').onclick = () => {
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch {}
  ctx.resume().then(() => { $('#unmute').style.display = 'none'; if (leader >= 0) playMusic(teams[leader]); });
};
document.addEventListener('touchend', () => { if (ctx && started && ctx.state !== 'running') $('#unmute').onclick(); }, { passive: true });

$('#go').onclick = () => { if (!$('#user').value.trim()) { $('#user').focus(); return; } begin(false); };
$('#demo').onclick = () => begin(true);
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; muted ? stopMusic() : playMusic(teams[leader]); };
let resetArm = 0;
$('#reset').onclick = () => {
  const now = Date.now(); if (now - resetArm > 1500) { resetArm = now; showBanner('Sıfırlamak için tekrar dokun'); return; }
  resetArm = 0; likeBank = 0; teams.forEach(t => { t.puan = 0; t.offset = 0; }); leader = -1; stopMusic(); render();
};
$('#back').onclick = () => { clearInterval(demoTimer); if (es) es.close(); stopMusic(); $('#start').style.display = 'flex'; };

sizeCanvases(); render(); requestAnimationFrame(frame);
</script>
